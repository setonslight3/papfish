<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Papfish - explore chess openings, build a personal repertoire and train it against realistic opponents." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Papfish" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Papfish - Chess Repertoire Trainer</title>
    <style>
      /* The boot screen: shown from the first paint until React takes over,
         so opening Papfish is never a blank page. React replaces #root's
         contents on mount, which removes it. */
      #papfish-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #0b1120;
        color: #94a3b8;
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 0.875rem;
        letter-spacing: 0.02em;
      }
      #papfish-splash svg {
        width: 112px;
        height: 112px;
      }
      #papfish-splash .bar {
        width: 10rem;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: #1e293b;
      }
      #papfish-splash .bar span {
        display: block;
        width: 33%;
        height: 100%;
        border-radius: 999px;
        background: #0ea5e9;
        animation: papfish-boot-sweep 1.4s ease-in-out infinite;
      }
      @keyframes papfish-boot-sweep {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #papfish-splash .bar span,
        #papfish-splash animateTransform {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="papfish-splash">
        <!-- papfish:splash -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="112" height="112">
  <circle cx="32" cy="32" r="31" fill="#f3f8fc"/>
  
  <g transform="translate(32 32) scale(0.840) translate(-32 -32)">
    <g><animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 32 25" to="360 32 25" dur="2.4s" repeatCount="indefinite"/>
      <rect x="30.5" y="6" width="3" height="5" rx="1.5" fill="#3a6f99" transform="rotate(22.5 32 25)"/><rect x="30.5" y="6" width="3" height="5" rx="1.5" fill="#3a6f99" transform="rotate(67.5 32 25)"/><rect x="30.5" y="6" width="3" height="5" rx="1.5" fill="#3a6f99" transform="rotate(112.5 32 25)"/><rect x="30.5" y="6" width="3" height="5" rx="1.5" fill="#3a6f99" transform="rotate(157.5 32 25)"/><rect x="30.5" y="6" width="3" height="5" rx="1.5" fill="#3a6f99" transform="rotate(202.5 32 25)"/><rect x="30.5" y="6" width="3" height="5" rx="1.5" fill="#3a6f99" transform="rotate(247.5 32 25)"/><rect x="30.5" y="6" width="3" height="5" rx="1.5" fill="#3a6f99" transform="rotate(292.5 32 25)"/><rect x="30.5" y="6" width="3" height="5" rx="1.5" fill="#3a6f99" transform="rotate(337.5 32 25)"/>
      <circle cx="32" cy="25" r="15" fill="none" stroke="#5b8fb9" stroke-width="3.5"/>
      <line x1="32" y1="11" x2="32" y2="22" stroke="#5b8fb9" stroke-width="3" stroke-linecap="round" transform="rotate(0 32 25)"/><line x1="32" y1="11" x2="32" y2="22" stroke="#5b8fb9" stroke-width="3" stroke-linecap="round" transform="rotate(45 32 25)"/><line x1="32" y1="11" x2="32" y2="22" stroke="#5b8fb9" stroke-width="3" stroke-linecap="round" transform="rotate(90 32 25)"/><line x1="32" y1="11" x2="32" y2="22" stroke="#5b8fb9" stroke-width="3" stroke-linecap="round" transform="rotate(135 32 25)"/><line x1="32" y1="11" x2="32" y2="22" stroke="#5b8fb9" stroke-width="3" stroke-linecap="round" transform="rotate(180 32 25)"/><line x1="32" y1="11" x2="32" y2="22" stroke="#5b8fb9" stroke-width="3" stroke-linecap="round" transform="rotate(225 32 25)"/><line x1="32" y1="11" x2="32" y2="22" stroke="#5b8fb9" stroke-width="3" stroke-linecap="round" transform="rotate(270 32 25)"/><line x1="32" y1="11" x2="32" y2="22" stroke="#5b8fb9" stroke-width="3" stroke-linecap="round" transform="rotate(315 32 25)"/>
      <circle cx="32" cy="25" r="4.5" fill="#3a6f99"/>
    </g>
    <g>

      <circle cx="45" cy="38" r="3.2" fill="#ffffff" stroke="#0b2b45" stroke-width="1.6"/>
      <circle cx="45.8" cy="38" r="1.5" fill="#0b2b45"/>
    </g>
  </g>
</svg>
        <!-- /papfish:splash -->
        <p>Casting off…</p>
        <div class="bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
